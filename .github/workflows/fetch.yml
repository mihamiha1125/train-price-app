name: ヤフオク落札相場の取得

on:
  schedule:
    # GitHub Actions は UTC。JST 7:00 / 12:00 / 19:00
    - cron: "0 22 * * *"
    - cron: "0 3 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 落札相場を取得
        env:
          TZ: Asia/Tokyo
        run: python scraper/fetch.py
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') 落札相場を更新"
          git push
